<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LinguaTranslate</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>

            <div class="logo">
                🌐 LinguaTranslate
            </div>

            <p>
                Translate your text quickly and easily
            </p>

        </header>


        <!-- Main Translator -->
        <main class="translator-card">

            <!-- Languages -->
            <div class="language-section">

                <div class="language-box">

                    <label for="sourceLanguage">
                        Source Language
                    </label>

                    <select id="sourceLanguage">

                        <option value="auto">
                            Detect Language
                        </option>

                        <option value="en">
                            English
                        </option>

                        <option value="hi">
                            Hindi
                        </option>

                        <option value="mr">
                            Marathi
                        </option>

                        <option value="fr">
                            French
                        </option>

                        <option value="es">
                            Spanish
                        </option>

                        <option value="de">
                            German
                        </option>

                        <option value="it">
                            Italian
                        </option>

                        <option value="ja">
                            Japanese
                        </option>

                        <option value="ko">
                            Korean
                        </option>

                         <option value="zh">
                            Chinese
                        </option>

                        <option value="zh">
                            Tamil
                        </option>

                        <option value="zh">
                            Telugu
                        </option>

                        <option value="zh">
                            Malayalam
                        </option>


                    </select>

                </div>


                <!-- Swap -->
                <button
                    id="swapButton"
                    class="swap-btn"
                    title="Swap Languages">

                    ⇄

                </button>


                <div class="language-box">

                    <label for="targetLanguage">
                        Target Language
                    </label>

                    <select id="targetLanguage">

                        <option value="en">
                            English
                        </option>

                        <option value="hi">
                            Hindi
                        </option>

                        <option value="mr">
                            Marathi
                        </option>

                        <option value="fr">
                            French
                        </option>

                        <option value="es">
                            Spanish
                        </option>

                        <option value="de">
                            German
                        </option>

                        <option value="it">
                            Italian
                        </option>

                        <option value="ja">
                            Japanese
                        </option>

                        <option value="ko">
                            Korean
                        </option>

                       <option value="zh">
                            Chinese
                        </option>

                        
                       <option value="Tamil">
                            Tamil
                        </option>


                        
                       <option value="tel">
                            Telugu
                        </option>

                        
                       <option value="Mly">
                            Malayalam
                        </option>

                    </select>

                </div>

            </div>


            <!-- Translation Boxes -->
            <div class="translation-area">


                <!-- Input -->
                <div class="input-box">

                    <div class="box-header">

                        <span>
                            Your Text
                        </span>

                        <span id="charCount">
                            0 / 5000
                        </span>

                    </div>


                    <textarea
                        id="inputText"
                        maxlength="5000"
                        placeholder="Enter text to translate...">
                    </textarea>


                    <button
                        id="clearButton"
                        class="clear-btn">

                        Clear

                    </button>

                </div>


                <!-- Output -->
                <div class="output-box">

                    <div class="box-header">

                        <span>
                            Translation
                        </span>

                        <span>
                            Result
                        </span>

                    </div>


                    <div
                        id="translationResult"
                        class="translation-result">

                        Your translation will appear here...

                    </div>


                    <div class="output-buttons">

                        <button id="copyButton">
                            📋 Copy
                        </button>

                        <button id="speakButton">
                            🔊 Listen
                        </button>

                    </div>

                </div>

            </div>


            <!-- Translate -->
            <button
                id="translateButton"
                class="translate-btn">

                <span id="buttonText">
                    Translate
                </span>

            </button>


            <!-- Status -->
            <div id="statusMessage"></div>

        </main>


        <!-- Footer -->
        <footer>

            Language Translator
            • HTML • CSS • JavaScript • Node.js

        </footer>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
